bio: |
  I am a Ph.D. student in Computer Science and Software Engineering at Auburn
  University, working on **computer vision**: video understanding, human activity
  and violence detection, person detection and tracking, and object detection.

  Most of my work starts from a measurement question rather than an architectural
  one: *when we say a representation or a model is better, what exactly have we
  measured, and would that conclusion survive a different dataset, a perturbed
  input, or a significance test?*

  In video, that question produced a controlled study of interaction
  representations for early violence detection. Holding the tracker, the temporal
  head, the supervision and the evaluation fixed, no pose-based representation
  outperformed coarse bounding-box geometry. Scoring anomalous videos using only
  the frames *preceding* the annotated onset still retained 39–91% of the
  above-chance separation — which traced back to editorial title cards and platform
  watermarks absent from the surveillance footage supplying the normal class.
  Video-level AUC on these benchmarks is therefore a composite of event evidence and
  pre-event source cues, a shared source of discrimination that can obscure real
  differences between representations.

  The same question applied to language models produced a systematic zero-shot
  evaluation of 41 open-weight models across eight intent-classification datasets,
  where the interesting result was not a leaderboard but the finding that several
  widely used benchmarks no longer discriminate between current models at all.

  Alongside the research I build systems: an auditor that finds duplicate images
  leaking across dataset splits and measures how much that inflates a reported
  accuracy, a retrieval pipeline over roughly 25,000 research papers, and a
  digital-engineering data platform.

  Before returning to research I spent about eighteen months as an Associate
  Software Developer at Emids Technologies in Bangalore, building CRM modules
  and REST services in Java and Spring Boot. That period is why I care about
  systems that are maintainable and honest about their own failure modes, not
  just accurate on a held-out split.
