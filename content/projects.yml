- id: intent-classification-benchmark
  name: Zero-Shot Intent Classification Benchmark
  tagline: >-
    A systematic zero-shot evaluation of 41 open-weight language models across
    eight intent-classification datasets.
  kind: research
  status: completed
  year: 2026
  featured: true
  order: 10
  researchAreas: [language-model-evaluation]
  technologies: [Python, Hugging Face Transformers, PyTorch, vLLM, Statistical Testing]
  problem: |
    Choosing an open-weight language model for a zero-shot classification task is
    normally settled by one accuracy number on one benchmark. That number does
    not say whether the gap between the top two models is real, whether the
    model's confidence is trustworthy, whether performance survives a typo, or
    whether the benchmark still has headroom to measure with.
  motivation: |
    The practical question — *which model should I actually deploy?* — needs
    evidence that a leaderboard does not supply. Selecting a 7B model when a
    3B instruction-tuned model performs comparably is a recurring and expensive
    default.
  experimentalSetup: |
    - **41 open-weight models**, spanning **15 model families** and the
      **135M–9B** parameter range.
    - **Eight English single-label intent-classification datasets**, covering
      standard academic benchmarks, a large-scale voice-assistant corpus, and
      production-derived e-commerce datasets.
    - Evaluation is **zero-shot** throughout — no fine-tuning on the target
      datasets.
    - Measured beyond exact-match accuracy: confidence calibration, robustness
      to realistic input perturbations, statistical reliability of rankings,
      deployment efficiency, and benchmark saturation.
  results: |
    Three findings from the paper, each scoped to this benchmark suite:

    1. **Parameter count is a poor selection criterion.** Instruction-tuned 3B
       models outperform several of the evaluated 7B base models.
    2. **Leading models on MASSIVE are statistically indistinguishable.** Under
       pairwise McNemar tests the differences between the top models do not
       reach significance — ranking them by raw accuracy overstates the gap.
    3. **SNIPS has saturated.** It no longer meaningfully discriminates among
       current open-weight models, which limits what a result reported on it
       alone can support.
  limitations: |
    Scoped to English, single-label intent classification, and to models in the
    135M–9B range under a fixed zero-shot prompting protocol. Conclusions about
    benchmark saturation are statements about these datasets and this model pool,
    not about intent classification in general.
  futureWork: |
    Extending the protocol to tasks where label ambiguity is intrinsic, and
    treating benchmark saturation as a quantity to monitor rather than something
    discovered retrospectively.
  relatedPublications: [intent-classification-41-models]
  links:
    paper:
      label: arXiv:2607.27421
      url: https://arxiv.org/abs/2607.27421
      verified: true
  sources:
    - 'Resume (Publications)'
    - 'arXiv listing for 2607.27421'

- id: early-violence-detection
  name: Interaction Representations for Early Violence Detection
  tagline: >-
    A controlled ablation isolating how much explicit interaction modelling
    contributes to early detection in video.
  kind: research
  status: active
  year: 2026
  featured: true
  order: 20
  researchAreas: [video-understanding-safety]
  technologies: [PyTorch, Computer Vision, Video Understanding, Ablation Studies]
  problem: |
    Work on interaction-aware video models generally reports that adding an
    interaction module improves performance. It rarely separates that
    improvement from the backbone, the training schedule, or the evaluation
    protocol — so the size of the contribution attributable to the interaction
    representation itself is usually unknown.
  motivation: |
    This is framed as a measurement study, not a detector. Early detection
    forces a model to commit before an event has finished, on partial evidence,
    which makes it a sharp setting in which to ask what a representation is
    actually contributing. The value of the answer is methodological: it tells
    you whether the module is doing work, or whether the backbone was.
  method: |
    Hold the backbone, the data and the evaluation protocol fixed, and vary only
    the interaction representation. The reported quantity is the attributable
    contribution under those fixed conditions — a benchmark-scoped number, not a
    general capability claim.
  responsibleUse: |
    This is empirical research on representation learning conducted on
    benchmark datasets. It is not a deployable surveillance system and is not
    presented as one. Systems that classify human behaviour from video carry
    well-documented risks — distributional bias, error costs that fall unevenly
    on the people being observed, and function creep once deployed. Any claim
    from this work is scoped to the benchmarks it was measured on.
  futureWork: |
    Characterising attributable contribution as a function of how much of an
    event has been observed, and identifying the point at which interaction
    representations stop helping.
  relatedPublications: [interaction-representations-early-violence]
  sources:
    - 'Resume (Publications): title, first authorship, submission to WACV'

- id: sentinel-memory
  name: Sentinel Memory
  tagline: >-
    An incident-response agent whose memory is a transactional database rather
    than a context window — it remembers consequences, not conversations.
  kind: hackathon
  status: prototype
  year: 2026
  featured: true
  order: 30
  researchAreas: [agentic-memory-systems]
  repository: ParishruthiGanesh/sentinel-memory
  relatedHackathons: [cockroachdb-aws-agentic-memory]
  technologies:
    - TypeScript
    - Next.js
    - React 19
    - Tailwind CSS
    - CockroachDB
    - Amazon Bedrock
    - Vector Search
    - Zod
    - Vitest
  problem: |
    During industrial incidents, personnel rotate and agents restart. Each
    handoff loses the record of what was already attempted and what it caused,
    so a reasonable-looking action gets repeated — including the one that did
    damage last time. An agent whose memory is a context window has the same
    failure mode, and reaches it faster.
  motivation: |
    The narrower question behind the project was not "how do we give agents
    memory?" but **what specifically does an incident agent need to remember?**
    The answer turned out not to be conversations. It was consequences: what a
    given action, taken in a given situation, actually caused.
  architecture: |
    A three-tier system with no ORM, no separate vector database, no queue and
    no cache layer:

    - **Client** — Next.js App Router UI (React 19, Tailwind CSS).
    - **Server** — Node.js API routes holding the orchestration logic.
    - **Services** — CockroachDB Cloud for persistence, Amazon Bedrock for
      reasoning and embeddings.

    The agent loop lives in a single file: embed the proposed action → retrieve
    precedents from CockroachDB by cosine distance → ground the Bedrock call on
    what came back → validate the structured response with Zod → persist the
    recommendation together with the memory IDs it cited. Every step writes a
    durable memory event, including the retrieval itself, so the timeline shows
    that memory was consulted rather than merely that an answer appeared.

    The one architectural decision that mattered was making `DataStore`,
    `EmbeddingProvider` and `Reasoner` **interfaces** rather than integrations.
    Each has a real implementation and a clearly labelled local fallback, which
    makes the interface previewable without credentials and the transaction
    logic unit-testable without a live cluster.
  method: |
    **Episodic and semantic memory are treated as two problems, not one.**
    Episodic memory records what happened in an incident, in order; semantic
    memory records `action_taken → outcome → lesson_learned` as distinct
    fields. Storing incident summaries and embedding them gets you "similar
    incidents"; storing the action-outcome triple gets you "this specific action
    caused this specific damage", which is the question a responder actually has.

    Keeping both in one database means retrieval returns the memory *and* its
    provenance — incident code, severity, date — in a single query, and the
    human decision that follows is transactional against the same rows.

    **Safety is enforced after the model, not requested from it.** The prompt
    states the rules; `enforceSafetyFloor` then runs on every response, forces
    human approval on any high-risk physical action regardless of what the model
    returned, and filters citations down to memory IDs that were genuinely
    retrieved, so a hallucinated reference cannot reach a responder.
  results: |
    - **94 tests** covering validation, retrieval, transactions, agents and
      health checks — none requiring a live cluster or an AWS account.
    - The approval path commits **four writes in one transaction** with
      `SELECT … FOR UPDATE` locking and application-owned `40001` retry with
      exponential backoff and full jitter, with tests proving rollback leaves the
      store unchanged.
    - The handoff demonstration reconstructs full incident state from the
      database alone after the primary agent disconnects — nothing is read from a
      transcript.
  errorAnalysis: |
    Two failure modes documented during development:

    - **Retrieval returned one story instead of three.** Vector search over a
      corpus where a single past incident contributes four memories returns four
      angles on that one incident and crowds out every other precedent. Fixed by
      over-fetching and then capping per source incident in application code.
    - **The local fallback embedder produces honest but unimpressive scores.**
      Bag-of-words similarity between a short query and a long document is
      bounded, landing around 0.4–0.65 where a learned model would give
      0.85–0.95. The raw cosine is kept and explained rather than rescaled to
      look better.
  limitations: |
    Documented in the repository rather than hidden:

    - **No authentication and no RBAC** — every visitor acts as the configured
      responder, which is exactly as trustworthy as the audit trail's
      `decided_by` field then is.
    - Rate limiting is in-process and therefore not multi-instance safe.
    - Seeded incidents are **synthetic**, not real incident reports.
    - The vector index is version-gated (CockroachDB v25.2 preview, GA in
      v25.3+); where it cannot be created the app degrades to an exact scan and
      says so in the health endpoint and the UI.
  responsibleUse: |
    A prototype built during a hackathon, seeded with synthetic incidents. It is
    a demonstration of a memory architecture, not an operational safety system,
    and the repository's limitations section is written to keep that distinction
    clear. Every fallback — in-memory store, local reasoner, deterministic
    embeddings — is labelled in the UI, the health endpoint and every API
    response, so nothing claims to be an integration it isn't.
  setup: |
    Runs locally with no credentials, using an in-memory store and local
    reasoning:

    ```bash
    git clone https://github.com/ParishruthiGanesh/sentinel-memory.git
    cd sentinel-memory
    npm install
    cp .env.example .env.local
    npm run dev
    ```

    To wire up real services, set `DATABASE_URL` and run `npm run db:migrate`
    and `npm run db:seed`, then set `AWS_REGION` and `BEDROCK_MODEL_ID`.
    `curl -s localhost:3000/api/health` reports which implementation is actually
    serving each interface.
  futureWork: |
    1. **Close the learning loop** — capture whether an approved action produced
       its predicted outcome and write that back as a new memory.
    2. **Authentication and RBAC**, without which `decided_by` cannot be trusted.
    3. **Database-enforced immutability** for memory and audit events.
    4. **Real ingestion** from SCADA/historian feeds instead of manual entry.
    5. **Retrieval evaluation** with a labelled set and precision@k tracking.
  highlights:
    - Counterfactual card surfacing the closest historical precedent, its similarity score and what it cost
    - Retrieval telemetry shown in the UI — cosine distance, latency, index versus exact scan
    - Four-write atomic approval under SERIALIZABLE isolation with application-owned retry
    - Agent handoff rebuilding incident state entirely from the database
  screenshots:
    - src: /images/projects/sentinel-memory/command-center.webp
      alt: Sentinel Memory command centre showing an active incident, the proposed action, and a counterfactual memory card describing what the same action caused during a previous incident.
      caption: The command centre. The counterfactual card renders server-side on load, so the precedent is visible before anything is clicked.
    - src: /images/projects/sentinel-memory/memory-explorer.webp
      alt: Memory explorer listing retrieved memories with cosine distance scores, source incident codes and retrieval latency.
      caption: Memory explorer, showing retrieval telemetry — distance, latency, and whether the vector index or an exact scan served the query.
    - src: /images/projects/sentinel-memory/timeline.webp
      alt: Incident timeline reconstructed from durable memory events, showing observations, retrievals, recommendations and human decisions in order.
      caption: The incident timeline is reconstructed from durable events, including the retrieval steps themselves.
    - src: /images/projects/sentinel-memory/handoff-briefing-full.webp
      alt: Agent handoff briefing rebuilt from the database, listing what happened, what was attempted, what must not be repeated and what remains open.
      caption: After the primary agent disconnects, the backup rebuilds incident state from the database — nothing comes from a transcript.
    - src: /images/projects/sentinel-memory/architecture.webp
      alt: Architecture diagram showing the Next.js client, Node.js API routes, and the CockroachDB and Amazon Bedrock services behind the DataStore, EmbeddingProvider and Reasoner interfaces.
      caption: The architecture page rendered inside the application itself.
  links:
    repo:
      label: GitHub — sentinel-memory
      url: https://github.com/ParishruthiGanesh/sentinel-memory
      verified: true
    demo:
      label: Live demo
      url: https://sentinel-memory-git-main-pari19.vercel.app
      verified: false
    devpost:
      label: Devpost submission
      url: https://devpost.com/software/sentinal-memory
      verified: false
    video:
      label: Demo video
      url: https://youtu.be/zg6Ys6pP6LA
      verified: false
  sources:
    - 'github.com/ParishruthiGanesh/sentinel-memory — README.md and docs/DEVPOST_SUBMISSION.md'
    - 'GitHub API repository metadata'
    - 'Demo, Devpost and YouTube URLs supplied directly by Parishruthi'

