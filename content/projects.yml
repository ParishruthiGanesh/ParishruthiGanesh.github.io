- id: circular-trade-fraud-detection
  name: Circular Trade Fraud Detection with Graph Learning
  tagline: >-
    Detecting circular trading rings in iron-dealer invoice data using cycle
    detection, Node2Vec embeddings and density-based clustering.
  kind: research
  status: completed
  year: 2024
  featured: false
  order: 70
  researchAreas: [applied-ai-data-systems]
  repository: ParishruthiGanesh/Circular-trade-Fraud-Detection
  technologies: [Python, Node2Vec, DBSCAN, Graph Algorithms, Jupyter]
  problem: |
    Circular trading — where invoices cycle through a ring of participants to
    inflate apparent turnover — is invisible to per-transaction rules, because
    every individual invoice looks ordinary. The signal only exists in the
    structure of the transaction graph.
  dataset: |
    Iron-dealer transaction data, where each row is one invoice recording the
    seller, the buyer and the transaction value.
  method: |
    - Build a multi-graph representation of the invoice data.
    - Detect **2-cycles and 3-cycles** and compute a suspicion score per node
      from cycle membership and trading amounts, using hash functions for
      efficient score storage across cycle nodes.
    - Generate node embeddings with **Node2Vec** over undirected graphs derived
      from suspicion scores and cycle frequencies.
    - Cluster with **DBSCAN** to isolate dense regions of potentially fraudulent
      nodes.
  results: |
    The pipeline identifies dense clusters of nodes exhibiting anomalous trading
    behaviour consistent with circular trading patterns.
  limitations: |
    Cycle detection is limited to 2- and 3-cycles, so longer rings are outside
    what this construction can surface. Outputs are unsupervised suspicion
    signals for investigation, not determinations of fraud.
  links:
    repo:
      label: GitHub — Circular-trade-Fraud-Detection
      url: https://github.com/ParishruthiGanesh/Circular-trade-Fraud-Detection
      verified: true
  sources:
    - 'Resume (Projects → Circular Trade Fraud Detection using Graph Neural Networks)'
    - 'GitHub repository description and metadata'

