    - name: AUSME Faculty Expertise RAG System
      stack: [Python, RAG, LangGraph, Web Scraping, LLMs]
      summary: >-
        A retrieval-augmented system that generates contextual summaries of
        faculty research papers and exposes them through a conversational
        interface for exploring expertise and potential collaborations.
      highlights:
        - >-
          Designed and built a retrieval-augmented generation system generating
          contextual summaries of faculty research papers, enabling an
          interactive chatbot-like interface for exploring expertise and
          potential collaborations across 50+ faculty members.
        - >-
          Collected and pre-processed a dataset of roughly 25,000 research
          papers by scraping metadata and full texts, achieving a complete
          retrieval pipeline processing time of 30 minutes for the entire corpus.
        - >-
          Built the data ingestion and preprocessing pipeline using LangGraph,
          integrating document parsing, metadata structuring and embedding
          generation to support semantic retrieval over large-scale research
          collections.
        - >-
          Proposed a deployment architecture allowing faculty and research groups
          to query publications in natural language, improving visibility of
          research domains and supporting interdisciplinary team formation.
      relatedProjects: [ausme-faculty-rag]

    - name: DEMA — Digital Engineering Data Management Platform
      stack: [React, Electron, Vite, Java, Spring Boot]
      summary: >-
        A full-stack desktop application for engineering data lifecycle
        management, implementing the CIM4DE conceptual information model.
      highlights:
        - >-
          Architecting a full-stack desktop application for engineering data
          lifecycle management using React, Electron and Vite on the frontend
          with Java/Spring Boot backend services.
        - >-
          Implemented the complete CIM4DE (Conceptual Information Model for
          Digital Engineering) specification, designing data models for entity
          relationships, classification hierarchies and metadata schemas.
        - >-
          Developed automated data-quality classification logic to identify and
          categorise engineering records by completeness and validation criteria.
        - >-
          Collaborating on system integration with engineering workflows,
          enabling traceability and consistency across digital engineering
          processes through standardised metadata management.
      relatedProjects: [dema-platform]

    - name: Interactive Rocket Simulation for Science Education
      stack: [Unity, 'C#', Physics Simulation]
      summary: >-
        An interactive Unity simulation letting students change rocket
        parameters and observe the resulting flight behaviour in real time.
      highlights:
        - >-
          Developed an interactive rocket simulation in Unity to enhance science
          education, enabling students to modify rocket parameters (fuel
          capacity, thrust) and observe real-time outcomes in a virtual
          environment.
        - >-
          Built multi-user interaction support across PC and tablet platforms,
          integrating realistic physics calculations for velocity and altitude
          tracking while refining UI, level generation and environmental
          interactions.
      relatedProjects: [rocket-simulation]

