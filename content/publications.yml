- id: intent-classification-41-models
  title: >-
    Selecting Open-Weight Language Models for Zero-Shot Intent Classification:
    A Systematic Evaluation of 41 Models
  authors:
    - Parishruthi Ganesh
    - Gerry Dozier
    - Cheryl Seals
  highlightAuthor: Parishruthi Ganesh
  venue: arXiv preprint
  venueShort: arXiv
  year: 2026
  status: preprint
  statusNote: Preprint available on arXiv; submitted to AAAI.
  featured: true
  order: 10
  abstract: >-
    A systematic zero-shot evaluation of 41 open-weight language models spanning
    15 families and the 135M–9B parameter range, across eight English
    single-label intent-classification datasets covering standard benchmarks, a
    large-scale voice-assistant corpus, and production-derived e-commerce
    datasets. Beyond exact-match accuracy the study analyses confidence
    calibration, robustness to realistic input perturbations, statistical
    reliability of model rankings, deployment efficiency, and benchmark
    saturation. Results show that instruction-tuned 3B models can outperform
    several evaluated 7B base models, that differences among leading models on
    MASSIVE are statistically indistinguishable under pairwise McNemar tests,
    and that widely used benchmarks such as SNIPS have become saturated and no
    longer meaningfully discriminate among current open-weight models.
  researchAreas: [language-model-evaluation]
  arxivId: '2607.27421'
  paperUrl: https://arxiv.org/abs/2607.27421
