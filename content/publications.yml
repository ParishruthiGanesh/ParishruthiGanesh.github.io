- id: interaction-representations-early-violence
  title: >-
    What Do Interaction Representations Actually Measure? Pre-Event Separability
    in Weakly-Supervised Violence Detection
  authors:
    - Parishruthi Ganesh
  highlightAuthor: Parishruthi Ganesh
  venue: arXiv preprint
  venueShort: arXiv
  year: 2026
  status: preprint
  statusNote: >-
    Preprint available on arXiv; submitted to WACV. arXiv posting is not peer
    review, so no acceptance is claimed and no venue year is asserted.
  featured: true
  order: 20
  abstract: >-
    Articulated human pose provides detailed body-configuration information
    beyond coarse spatial relationships, but whether this detail yields
    greater discriminative information when the downstream pipeline is held
    fixed remains unclear. We examine this through early violence detection.
    Holding the tracker, temporal head, supervision, folds, and evaluation
    fixed, we compare five interaction representations spanning coarse
    bounding-box geometry, a matched handcrafted pose analogue, enriched
    pose descriptors, and a matched-capacity encoder learned from raw
    joints, under video-level evaluation with cluster-bootstrap intervals.
    No pose-based representation outperforms coarse geometry, though with
    fifteen anomalous videos this subset cannot rule out small effects.
    Extending the pipeline to frozen visual encoders, and repeating the
    comparison on XD-Violence (137 anomalous videos, nine times our UCF-
    Crime sample), person-crop appearance and whole-frame context both
    exceed geometry by a wide margin, yet context matches appearance on UCF-
    Crime and exceeds it on the larger split: cropping to the interacting
    people yields no advantage over encoding the whole frame. This prompts a
    direct test of what the benchmark measures. Scoring anomalous videos
    using only frames preceding the annotated onset, under a control
    removing sequence length as a cue, retains 39-91% of above-chance
    separation on both benchmarks, including for seven hand-designed
    geometric channels. Inspection of the tightest pre-onset windows
    identifies concrete provenance artifacts: editorial title cards and
    platform watermarks absent from the surveillance footage supplying the
    normal class. Video-level AUC here is thus a composite of event evidence
    and pre-event source cues, a shared source of discrimination that can
    obscure differences between representations. The diagnostic requires
    only annotations these benchmarks already ship.
  researchAreas: [video-understanding-safety]
  arxivId: '2608.27879'
  paperUrl: https://arxiv.org/abs/2608.27879
  lastVerified: '2026-09-03'
