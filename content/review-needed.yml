- id: phd-title-conflict
  severity: low
  area: profile
  raisedAt: '2026-08-18'
  summary: >-
    The resume says "Ph.D. candidate in Computer Science"; the programme listed
    under Education is "Ph.D. in Computer Science and Software Engineering",
    begun Fall 2025.
  detail: >-
    "Candidate" normally implies qualifying exams have been passed. Given the
    Fall 2025 start recorded on the same resume, the site uses the more
    conservative "Ph.D. Student, Computer Science and Software Engineering",
    matching the department name in the Education section.
  currentBehaviour: >-
    "Ph.D. Student, Computer Science and Software Engineering" is used in the
    hero, the page metadata and the structured data.
  action: >-
    If candidacy has been conferred, change `role` in content/profile.yml to
    "Ph.D. Candidate, Computer Science and Software Engineering".

- id: unverified-publications-excluded
  severity: high
  area: publications
  raisedAt: '2026-08-18'
  summary: >-
    Three suggested publications could not be verified and are not published.
  detail: >-
    "Vision-Based Livestock Respiratory Monitoring for Smart Agriculture Sensing
    Systems", "Geometry-Constrained Prototype Learning for Scarce-Data
    Open-World Detection", and separate LLM-as-judge / RAG papers were suggested
    as possible work. None appears on the resume, none was found under this
    author on arXiv, and no repository, preprint or DOI was supplied for any of
    them.
  currentBehaviour: >-
    None of the three is published on the site, and no research theme claiming
    smart-agriculture vision or LLM-as-judge evaluation exists, because there is
    no evidence to anchor one to.
  action: >-
    If any of these are real, add them with
    `npm run portfolio -- add-paper` supplying an arXiv ID, a DOI or manual
    metadata. Adding a paper with a research area that does not yet exist will
    fail validation, so add the corresponding theme to content/research.yml at
    the same time.

- id: paper-code-links-missing
  severity: medium
  area: publications
  raisedAt: '2026-08-18'
  summary: >-
    Neither published paper has a public code repository mapped to it.
  detail: >-
    content/research-links.yml is deliberately empty. No repository under this
    GitHub account corresponds to the 41-model intent-classification evaluation
    or to the WACV interaction study, and guessing a mapping by name similarity
    is exactly what the mapping file exists to prevent.
  currentBehaviour: >-
    Publication pages show no "Code" link, and the Research page shows the
    papers without an associated repository.
  action: >-
    When the code is public, run
    `npm run portfolio -- link-paper-code intent-classification-41-models
    ParishruthiGanesh/<repo>`.

- id: base44-site-unreachable
  severity: medium
  area: design
  raisedAt: '2026-08-18'
  summary: >-
    The existing Base44 site could not be fetched from the build environment.
  detail: >-
    parishruthi-ganesh.base44.app is blocked by the network egress policy in this
