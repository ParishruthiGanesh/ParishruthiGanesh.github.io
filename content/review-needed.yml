# Items needing Parishruthi's review. This file is not published as a page; it
# drives `npm run portfolio -- status` and is summarised in
# docs/PORTFOLIO_REVIEW.md.
#
# Anything that could not be verified lives here rather than being guessed at
# and published.

- id: astranova-repo-private
  severity: blocker
  area: repositories
  raisedAt: '2026-08-18'
  summary: >-
    The GitHub repository ParishruthiGanesh/astranova-trading-copilot is private,
    so its link is not publicly reachable.
  detail: >-
    The GitHub API reports visibility "private" for this repository (created
    2026-08-17). An anonymous visitor following the link receives a 404. All
    AstraNova detail on the site is therefore limited to what the repository
    description states, since the README could not be read.
  currentBehaviour: >-
    The Projects, Hackathons and Repositories pages label the repository
    "Private repository" and do not present it as a browsable link. No
    architecture, results or setup detail is published for AstraNova.
  action: >-
    Make the repository public if the hackathon submission is complete, then run
    `npm run portfolio -- sync`. The site will pick up the README-derived
    metadata and drop the private label automatically.

- id: astranova-devpost-in-progress
  severity: high
  area: hackathons
  raisedAt: '2026-08-18'
  summary: >-
    The AstraNova Devpost submission was marked in-progress at the time this
    site was built, and its exact hackathon edition was not independently
    confirmed.
  detail: >-
    The hackathon name "Build with Gemini XPRIZE" comes from the repository's own
    description. Devpost is unreachable from this build environment, so the
    submission page, its final status, team members and any placement could not
    be checked.
  currentBehaviour: >-
    The hackathon is shown with submissionStatus "in-progress", no award, and no
    team list. Its Devpost and demo links are marked as not machine-verified.
  action: >-
    Once the submission is final, set `submissionStatus: submitted` (or
    `judged`) in content/hackathons.yml, add verified team members, and add an
    award only if one was actually received.

- id: external-links-unverified
  severity: medium
  area: links
  raisedAt: '2026-08-18'
  summary: >-
    Devpost, YouTube, Vercel, Firebase and arXiv links could not be reached from
    the build environment's network, so they are published as supplied but
    marked unverified.
  detail: >-
    The environment used to build this site allows egress to github.com and a
    search index but blocks devpost.com, youtu.be, arxiv.org and the demo hosts.
    Every such URL was supplied directly by Parishruthi or read from a repository
    she wrote, so none is invented — but none was confirmed to resolve.
  currentBehaviour: >-
    Links carry `verified: false`, which renders a small "unverified" marker in
    the link list. `npm run portfolio -- linkcheck` re-checks them from any
    network that permits it and can flip the flag.
  action: >-
    Run `npm run portfolio -- linkcheck --fix` from an unrestricted network to
    confirm each URL and mark it verified.

- id: sentinel-demo-url-conflict
  severity: medium
  area: projects
  raisedAt: '2026-08-18'
  summary: >-
    Two different live-demo URLs exist for Sentinel Memory.
  detail: >-
    The repository README and the GitHub `homepage` field both give
    https://sentinel-memory-lemon.vercel.app. Parishruthi supplied
    https://sentinel-memory-git-main-pari19.vercel.app as the real URL. The
    user-supplied value is the more recent, explicitly structured source, so the
    site uses it.
  currentBehaviour: >-
    The site links to sentinel-memory-git-main-pari19.vercel.app. The GitHub
    homepage field is still synchronised into repositories.json but is not shown
    as the demo link for the project.
  action: >-
    Update the repository's homepage field and README on GitHub so the two agree,
    then re-run `npm run portfolio -- sync`.

- id: linkedin-url-conflict
  severity: low
  area: profile
  raisedAt: '2026-08-18'
  summary: >-
    The resume and the directly supplied LinkedIn URL differ.
  detail: >-
    The resume PDF hyperlinks to https://linkedin.com/in/parishruthi-ganesh.
    Parishruthi supplied
    https://www.linkedin.com/in/parishruthi-ganesh-85909b188/. The supplied URL
    is treated as authoritative as the more explicit and more recent source.
