- id: cockroachdb-aws-agentic-memory
  hackathon: CockroachDB × AWS — Build with Agentic Memory
  organizer: CockroachDB and AWS
  date: '2026-08-17'
  dateLabel: August 2026
  projectName: Sentinel Memory
  featured: true
  order: 10
  submissionStatus: submitted
  tagline: An incident-response agent that remembers consequences.
  problem: >-
    During industrial emergencies, personnel rotate and agents restart, losing
    the record of what was already attempted and what it caused. The same
    reasonable-looking action gets taken again — including the one that did
    damage last time — because the consequence history is not available at the
    moment the decision is being made. An agent whose memory is a context window
    reproduces that failure faster.
  whatItDoes: >-
    Sentinel Memory is an incident-response command centre where a database, not
    a context window, is the memory. When a responder proposes an action, the
    system embeds it, searches CockroachDB's distributed vector index for
    precedents, and surfaces what that exact action cost during a previous
    incident — with the incident code, date and damage — before recommending a
    safer sequence and citing the memory it drew that from. Approval commits the
    decision, the recommendation status, the incident state and the audit event
    in a single transaction. When the primary agent disconnects, a backup agent
    reconstructs the whole incident from the database alone.
  architecture: >-
    Next.js App Router with React 19 and TypeScript on the client; Node.js API
    routes holding the agent loop; CockroachDB Cloud for episodic and semantic
    memory with a VECTOR column and cosine-distance index; Amazon Bedrock via
    the Converse API for reasoning and embeddings. DataStore, EmbeddingProvider
    and Reasoner are interfaces with labelled local fallbacks, so the whole
    system is previewable and testable without credentials.
  technologies:
    - TypeScript
    - Next.js
    - React 19
    - Tailwind CSS
    - CockroachDB Cloud
    - Distributed Vector Indexing
    - Amazon Bedrock
    - Zod
    - Vitest
    - Vercel
  lessons:
    - >-
      Agent memory is two problems, not one. Episodic memory (what happened, in
      order) and semantic memory (what past actions caused) have different
      shapes and different consumers; conflating them yields a system that can
      replay a timeline or find similar text, but cannot answer "someone is
      about to do X — has X hurt us before?"
    - >-
      Keeping both in one database is the actual advantage, and the reason is
      the join: retrieval returns the memory together with its incident code,
      severity and date in a single query, and the human decision that follows
      is transactional against the same rows.
    - >-
      Structure memory around the action. Embedding incident summaries gets you
      "similar incidents"; storing action → outcome → lesson as distinct fields
      gets you "this specific action caused this specific damage".
    - >-
      Constraints beat prompts for safety. The prompt is necessary and not
      sufficient — schema CHECK constraints, Zod validation and a post-model
      safety floor are what make the guarantee real.
    - >-
      Honest degradation turned out to be a feature rather than a compliance
      chore: labelling exactly which implementation is running makes the
      architecture legible in a way a demo claiming everything works is not.
