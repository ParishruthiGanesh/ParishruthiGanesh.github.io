- id: speed-august-ai-thinktrace
  hackathon: SPEED August AI Challenge
  date: 2026-08-29
  dateLabel: August 2026
  projectName: ThinkTrace AI
  featured: true
  order: 20
  submissionStatus: submitted
  tagline: Don't just mark the wrong answer. ThinkTrace AI reads each student's written
    reasoning, groups the class by how it is confused, and keeps teaching until the
    misconception is demonstrably gone.
  problem: Marking an answer wrong records that a student failed without recording why. A
    teacher sees a score distribution, not the shape of the class's confusion, and a
    student sees a cross, not the specific belief that produced it. The two views are
    usually handled by separate tools — a quiz grader, a polling app, a tutor — so
    neither the class-level pattern nor the individual diagnosis informs the other.
  whatItDoes: "ThinkTrace AI shows a teacher how their whole class is confused, diagnoses
    why each individual student is confused, and keeps teaching until the misconception
    is demonstrably gone. It runs as one connected cycle of five stages: LecturePulse
    groups every written answer by the kind of reasoning behind it rather than by which
    option was ticked; ConceptLens identifies the specific belief that produced the
    answer and the counterexample that breaks it; prerequisite repair finds the shortest
    path back through the concept graph; ErrorTwin re-tests the same reasoning pattern
    in contexts the student has never seen; and Teach-back closes the loop only when the
    student can explain the concept themselves, not when a video finishes. Where most
    tools measure whether an answer was submitted and whether it was right, this
    measures why it was wrong, which prerequisite caused it, whether the same reasoning
    error appears elsewhere, and whether it has actually disappeared."
  technologies:
    - TypeScript
    - Next.js
    - React
    - Supabase
