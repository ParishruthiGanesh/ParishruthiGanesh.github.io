- id: proof-of-possible-2026-splitshield
  hackathon: Proof of Possible 2026
  date: 2026-08-22
  dateLabel: August 2026
  projectName: SplitShield
  featured: true
  order: 40
  submissionStatus: submitted
  tagline: Duplicate images leaking between train and test make model accuracy look better
    than it is. SplitShield finds the leakage, shows the evidence, repairs the split,
    and measures the difference.
  problem: "Duplicate and near-duplicate images that cross the train/validation/test
    boundary quietly inflate reported model performance: the model is graded on samples
    it has effectively already seen. This data leakage is common in scraped and merged
    datasets, hard to spot by eye, and rarely quantified."
  whatItDoes: "SplitShield audits an image-classification dataset for leakage across its
    splits, shows the evidence behind each finding, repairs the split, and quantifies
    how much the reported number changes as a result. It is aimed at computer-vision
    researchers, students and ML engineers who need to know whether their splits are
    trustworthy before quoting a number. Duplicate and near-duplicate pairs are surfaced
    by SHA-256 exact matching, perceptual hashing and appearance-embedding search,
    ranked by severity with side-by-side evidence. The repair is judged by an Observed
    Evaluation Gap: how much a diagnostic classifier's test accuracy moves once the
    leaked samples are quarantined. Uploads are analysed on the server, never shared or
    used for training, and deleted after a retention window or immediately on request."
  architecture: "A Next.js frontend talks over JSON HTTP to a FastAPI backend that runs
    the audit as a staged pipeline — ingest, index, exact-match, perceptual hash,
    embeddings, classify, score, repair, evaluation, report. Jobs run in a bounded
    thread pool and every stage transition is persisted to SQLite, so the UI polls
    rather than blocking. Storage is a local directory abstraction using random internal
    identifiers rather than user paths, behind an interface an S3-compatible layer can
    replace. Embeddings are pluggable: MobileNetV3-Small when torch and weights are
    available, otherwise a documented classical appearance descriptor built from
    structure, chromaticity and gradient histograms — and the active backend is reported
    in both the UI and the report rather than assumed."
  technologies:
    - Python
    - FastAPI
    - SQLite
    - PyTorch
    - MobileNetV3-Small
    - TypeScript
    - Next.js
    - React
    - Tailwind CSS
    - Recharts
    - Docker
